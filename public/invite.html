<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Join — Ada Operations Hub</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <!-- THEME RESOLVER — mirrors the dashboard so login honors the chosen theme (no FOUC). -->
  <script>
    (function () {
      window.__adaSolar = function (date, lat, lng) {
        var rad = Math.PI / 180;
        var jdate = Math.floor(date.valueOf() / 86400000 - 0.5 + 2440588);
        var n = jdate - 2451545.0 + 0.0008;
        var Jstar = n - lng / 360.0;
        var M = (357.5291 + 0.98560028 * Jstar) % 360, Mr = M * rad;
        var C = 1.9148 * Math.sin(Mr) + 0.02 * Math.sin(2 * Mr) + 0.0003 * Math.sin(3 * Mr);
        var lambda = ((M + C + 180 + 102.9372) % 360) * rad;
        var Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(Mr) - 0.0069 * Math.sin(2 * lambda);
        var sinDec = Math.sin(lambda) * Math.sin(23.44 * rad);
        var cosDec = Math.cos(Math.asin(sinDec));
        var cosOmega = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) /
                       (Math.cos(lat * rad) * cosDec);
        var base = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        var eod = new Date(base.getTime() + 86399000);
        if (cosOmega >= 1)  return { sunrise: eod, sunset: eod };
        if (cosOmega <= -1) return { sunrise: base, sunset: eod };
        var omega = Math.acos(cosOmega) / rad;
        var fromJ = function (J) { return new Date((J - 2440588 + 0.5) * 86400000); };
        return { sunrise: fromJ(Jtransit - omega / 360.0), sunset: fromJ(Jtransit + omega / 360.0) };
      };
      function resolve(mode) {
        if (mode === 'light' || mode === 'dark') return mode;
        if (mode === 'sunset') {
          var loc = null;
          try { loc = JSON.parse(localStorage.getItem('ada_geo') || 'null'); } catch (e) {}
          if (loc && typeof loc.lat === 'number') {
            var s = window.__adaSolar(new Date(), loc.lat, loc.lng), t = new Date();
            return (t >= s.sunrise && t < s.sunset) ? 'light' : 'dark';
          }
        }
        return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var mode = 'system';
      try { mode = localStorage.getItem('ada_theme') || 'system'; } catch (e) {}
      try { document.documentElement.setAttribute('data-theme', resolve(mode)); }
      catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <!-- Tailwind CSS (same CDN + config as the main dashboard, for visual consistency) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#1e1b4b'
            },
            dark: {
              bg: 'var(--bg)',
              card: 'var(--card)',
              border: 'var(--border)',
              accent: 'var(--accent)'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root, [data-theme="dark"] {
      --bg: #090d16; --card: #0f172a; --border: #1e293b; --accent: #334155; --text: #f8fafc;
    }
    [data-theme="light"] {
      --bg: #f1f5f9; --card: #ffffff; --border: #e2e8f0; --accent: #cbd5e1; --text: #0f172a;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color .2s ease, color .2s ease;
    }
    [data-theme="light"] .text-white { color: #0f172a; }
    [data-theme="light"] .text-gray-400 { color: #64748b; }
    [data-theme="light"] .text-gray-600 { color: #94a3b8; }
    [data-theme="light"] .placeholder-gray-500::placeholder { color: #94a3b8; }
    /* Keep white text on the gradient logo + submit button. */
    [data-theme="light"] [class*="bg-gradient"].text-white,
    [data-theme="light"] [class*="bg-indigo-"].text-white,
    [data-theme="light"] [class*="bg-purple-"].text-white { color: #ffffff; }
    .shake { animation: shake 0.35s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center antialiased px-4">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-600 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/20 mb-3">
        <i class="fa-solid fa-satellite-dish text-lg"></i>
      </div>
      <h1 class="text-lg font-black tracking-tight text-white">ADA OPERATIONS HUB</h1>
      <p id="subtitle" class="text-[11px] text-gray-400">Checking your link…</p>
    </div>

    <form id="join-form" class="hidden bg-dark-card border border-dark-border rounded-2xl p-6 shadow-xl space-y-4">
      <div id="new-fields" class="space-y-4">
        <div>
          <label for="username" class="block text-xs font-semibold text-gray-400 mb-1.5">Username</label>
          <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" class="w-full bg-dark-bg border border-dark-border rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/60 focus:border-indigo-500 transition-all" placeholder="sam" />
          <p class="text-[11px] text-gray-500 mt-1">Lowercase letters, digits, - or _. It can't be changed later.</p>
        </div>
        <div>
          <label for="display" class="block text-xs font-semibold text-gray-400 mb-1.5">Display name</label>
          <input type="text" id="display" autocomplete="nickname" maxlength="40" class="w-full bg-dark-bg border border-dark-border rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/60 focus:border-indigo-500 transition-all" placeholder="Sam" />
        </div>
      </div>
      <div>
        <label for="password" class="block text-xs font-semibold text-gray-400 mb-1.5">Password</label>
        <input type="password" id="password" autocomplete="new-password" required minlength="8" class="w-full bg-dark-bg border border-dark-border rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/60 focus:border-indigo-500 transition-all" placeholder="At least 8 characters" />
      </div>
      <div>
        <label for="password2" class="block text-xs font-semibold text-gray-400 mb-1.5">Password again</label>
        <input type="password" id="password2" autocomplete="new-password" required minlength="8" class="w-full bg-dark-bg border border-dark-border rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/60 focus:border-indigo-500 transition-all" />
      </div>
      <div id="error-box" class="hidden text-xs text-red-400 bg-red-950/40 border border-red-900/60 rounded-lg px-3 py-2">
        <i class="fa-solid fa-triangle-exclamation mr-1"></i><span id="error-text"></span>
      </div>
      <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white text-sm font-semibold rounded-lg px-4 py-2.5 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
        <i class="fa-solid fa-user-check"></i><span id="submit-label">Create account</span>
      </button>
    </form>

    <div id="message" class="hidden bg-dark-card border border-dark-border rounded-2xl p-6 shadow-xl text-sm text-gray-300 text-center space-y-3">
      <p id="message-text"></p>
      <a id="message-link" href="/login" class="hidden inline-block bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-lg px-4 py-2">Sign in</a>
    </div>
  </div>

  <script>
    // Invite and reset links (src/invites.js). The token is in the path; this page never sends it anywhere else.
    const token = location.pathname.split('/').pop();
    const $ = (id) => document.getElementById(id);
    let kind = 'invite';
    function finish(text, link) {
      $('join-form').classList.add('hidden');
      $('message').classList.remove('hidden');
      $('message-text').textContent = text;
      $('message-link').classList.toggle('hidden', !link);
    }
    function showError(msg) { $('error-text').textContent = msg; $('error-box').classList.remove('hidden'); }
    fetch('/api/invite/' + encodeURIComponent(token)).then(async (r) => {
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { $('subtitle').textContent = 'Link not valid'; return finish(d.error || 'This link has expired or was already used.'); }
      kind = d.kind;
      if (kind === 'reset') {
        $('subtitle').textContent = 'Set a new password for ' + d.username;
        $('new-fields').classList.add('hidden');
        $('submit-label').textContent = 'Set password';
      } else {
        $('subtitle').textContent = d.role === '303' ? "You've been invited to join as a household member" : "You've been invited to join as a guest";
      }
      $('join-form').classList.remove('hidden');
      (kind === 'reset' ? $('password') : $('username')).focus();
    }).catch(() => finish('Could not reach the server. Try again in a moment.'));
    $('username').addEventListener('input', (e) => { e.target.value = e.target.value.toLowerCase().replace(/\s/g, ''); });
    $('join-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('error-box').classList.add('hidden');
      if ($('password').value !== $('password2').value) return showError("The two passwords don't match.");
      const body = { password: $('password').value };
      if (kind !== 'reset') {
        body.username = $('username').value.trim();
        const dn = $('display').value.trim();
        if (dn) body.displayName = dn;
      }
      $('submit-btn').disabled = true;
      try {
        const r = await fetch('/api/invite/' + encodeURIComponent(token), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { $('submit-btn').disabled = false; return showError(d.error || 'That did not work.'); }
        finish(kind === 'reset' ? 'Your password is set. Sign in with it now.' : 'Your account "' + d.username + '" is ready. Sign in to start.', true);
      } catch (err) { $('submit-btn').disabled = false; showError('Could not reach the server. Try again.'); }
    });
  </script>
</body>
</html>
