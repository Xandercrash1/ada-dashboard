<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign in — Ada Operations Hub</title>
  <meta name="color-scheme" content="light dark">
  <!-- THEME RESOLVER — mirrors the dashboard so login honors the chosen theme (no FOUC). -->
  <script>
    (function () {
      window.__adaSolar = function (date, lat, lng) {
        var rad = Math.PI / 180;
        var jdate = Math.floor(date.valueOf() / 86400000 - 0.5 + 2440588);
        var n = jdate - 2451545.0 + 0.0008;
        var Jstar = n - lng / 360.0;
        var M = (357.5291 + 0.98560028 * Jstar) % 360, Mr = M * rad;
        var C = 1.9148 * Math.sin(Mr) + 0.02 * Math.sin(2 * Mr) + 0.0003 * Math.sin(3 * Mr);
        var lambda = ((M + C + 180 + 102.9372) % 360) * rad;
        var Jtransit = 2451545.0 + Jstar + 0.0053 * Math.sin(Mr) - 0.0069 * Math.sin(2 * lambda);
        var sinDec = Math.sin(lambda) * Math.sin(23.44 * rad);
        var cosDec = Math.cos(Math.asin(sinDec));
        var cosOmega = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * sinDec) /
                       (Math.cos(lat * rad) * cosDec);
        var base = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        var eod = new Date(base.getTime() + 86399000);
        if (cosOmega >= 1)  return { sunrise: eod, sunset: eod };
        if (cosOmega <= -1) return { sunrise: base, sunset: eod };
        var omega = Math.acos(cosOmega) / rad;
        var fromJ = function (J) { return new Date((J - 2440588 + 0.5) * 86400000); };
        return { sunrise: fromJ(Jtransit - omega / 360.0), sunset: fromJ(Jtransit + omega / 360.0) };
      };
      function resolve(mode) {
        if (mode === 'light' || mode === 'dark') return mode;
        if (mode === 'sunset') {
          var loc = null;
          try { loc = JSON.parse(localStorage.getItem('ada_geo') || 'null'); } catch (e) {}
          if (loc && typeof loc.lat === 'number') {
            var s = window.__adaSolar(new Date(), loc.lat, loc.lng), t = new Date();
            return (t >= s.sunrise && t < s.sunset) ? 'light' : 'dark';
          }
        }
        return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var mode = 'system';
      try { mode = localStorage.getItem('ada_theme') || 'system'; } catch (e) {}
      try { document.documentElement.setAttribute('data-theme', resolve(mode)); }
      catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <!-- Tailwind CSS (same CDN + config as the main dashboard, for visual consistency) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#1e1b4b'
            },
            dark: {
              bg: 'var(--bg)',
              card: 'var(--card)',
              border: 'var(--border)',
              accent: 'var(--accent)'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root, [data-theme="dark"] {
      --bg: #090d16; --card: #0f172a; --border: #1e293b; --accent: #334155; --text: #f8fafc;
    }
    [data-theme="light"] {
      --bg: #f1f5f9; --card: #ffffff; --border: #e2e8f0; --accent: #cbd5e1; --text: #0f172a;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color .2s ease, color .2s ease;
    }
    [data-theme="light"] .text-white { color: #0f172a; }
    [data-theme="light"] .text-gray-400 { color: #64748b; }
    [data-theme="light"] .text-gray-600 { color: #94a3b8; }
    [data-theme="light"] .placeholder-gray-500::placeholder { color: #94a3b8; }
    /* Keep white text on the gradient logo + submit button. */
    [data-theme="light"] [class*="bg-gradient"].text-white,
    [data-theme="light"] [class*="bg-indigo-"].text-white,
    [data-theme="light"] [class*="bg-purple-"].text-white { color: #ffffff; }
    .shake { animation: shake 0.35s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center antialiased px-4">

  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-600 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/20 mb-3">
        <i class="fa-solid fa-satellite-dish text-lg"></i>
      </div>
      <h1 class="text-lg font-black tracking-tight text-white">ADA OPERATIONS HUB</h1>
      <p class="text-[11px] text-gray-400">Sign in to continue</p>
    </div>

    <form id="login-form" class="bg-dark-card border border-dark-border rounded-2xl p-6 shadow-xl space-y-4">
      <div>
        <label for="password" class="block text-xs font-semibold text-gray-400 mb-1.5">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
          autofocus
          class="w-full bg-dark-bg border border-dark-border rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/60 focus:border-indigo-500 transition-all"
          placeholder="••••••••"
        />
      </div>

      <div id="error-box" class="hidden text-xs text-red-400 bg-red-950/40 border border-red-900/60 rounded-lg px-3 py-2">
        <i class="fa-solid fa-triangle-exclamation mr-1"></i>
        <span id="error-text">Incorrect password.</span>
      </div>

      <button
        type="submit"
        id="submit-btn"
        class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white text-sm font-semibold rounded-lg px-4 py-2.5 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <i class="fa-solid fa-right-to-bracket"></i>
        <span id="submit-label">Sign In</span>
      </button>
    </form>

    <p class="text-center text-[11px] text-gray-600 mt-4">Ada Operations Hub · Private Instance</p>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text');
    const submitBtn = document.getElementById('submit-btn');
    const submitLabel = document.getElementById('submit-label');

    function showError(msg) {
      errorText.textContent = msg;
      errorBox.classList.remove('hidden');
      form.classList.remove('shake');
      // force reflow to restart animation
      void form.offsetWidth;
      form.classList.add('shake');
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitLabel.textContent = loading ? 'Signing in…' : 'Sign In';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      setLoading(true);
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          const params = new URLSearchParams(window.location.search);
          const redirectTo = params.get('redirect') || '/';
          window.location.href = redirectTo;
          return;
        }
        showError(data.error || 'Sign in failed.');
      } catch (err) {
        showError('Network error — could not reach the server.');
      } finally {
        setLoading(false);
        passwordInput.value = '';
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
